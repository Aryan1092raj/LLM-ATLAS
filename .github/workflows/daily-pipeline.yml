name: daily-pipeline

# Daily ingestion per TRD §5 / §6: runs fetch → normalize → enrich → commit
# the updated public/data.json. The site redeploys automatically because
# GitHub Pages (or Vercel) reacts to commits on the working branch.

on:
  schedule:
    # 06:00 UTC every day. Random minute (per scheduler best practice —
    # avoids synchronized load on shared free-tier APIs).
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pandas/pyarrow are optional (only needed for leaderboard parquet).
      # Uncomment if/when we switch leaderboard fetcher to parquet.
      # - name: install pipeline deps
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install pandas pyarrow

      - name: run pipeline
        id: run
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: |
          cd pipeline
          python run.py
        continue-on-error: false

      - name: check and sync pipeline_runs.jsonl
        if: always()
        run: |
          if [ ! -s data/processed/pipeline_runs.jsonl ]; then
            echo "::error::pipeline_runs.jsonl is missing or empty"
            exit 1
          fi
          cp data/processed/pipeline_runs.jsonl public/pipeline_runs.jsonl
          echo "pipeline_runs.jsonl last entry:"
          tail -1 data/processed/pipeline_runs.jsonl

      - name: validate curated model ids
        if: always() && steps.run.outcome == 'success'
        run: |
          python scripts/validate_curated_ids.py

      - name: detect anomalies
        if: always() && steps.run.outcome == 'success'
        run: |
          python - <<'PY'
          """Per TRD §9: alert if new-model count deviates >3x from 7-day trailing avg."""
          import json, statistics, sys
          from pathlib import Path
          runs = [json.loads(l) for l in Path("data/processed/pipeline_runs.jsonl").read_text().splitlines() if l.strip()]
          new_per_run = [r.get("new_models_found", 0) for r in runs if r.get("source") == "enrich"]
          if len(new_per_run) < 2:
              sys.exit(0)
          last = new_per_run[-1]
          avg = statistics.mean(new_per_run[:-1]) if len(new_per_run) > 1 else last
          ratio = (last / avg) if avg > 0 else 1.0
          print(f"enrich new_models_found: last={last} avg={avg:.1f} ratio={ratio:.2f}")
          if ratio > 3 or ratio < 0.33:
              # Per TRD §9: open an issue when schema change suspected.
              print(f"::warning file=data/processed/pipeline_runs.jsonl::enrich count deviated >3x from trailing avg ({ratio:.2f}x)")
          PY

      - name: commit updates
        if: success()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "noreply@commandcode.ai"
          git add public/data.json public/pipeline_runs.jsonl data/processed/ data/raw/
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "pipeline: daily ingestion $(date -u +%Y-%m-%d)

          - updated public/data.json with auto-discovered models
          - synced public/pipeline_runs.jsonl
          - raw snapshots under data/raw/<source>/<date>.json
          - pipeline run log appended to data/processed/pipeline_runs.jsonl

          Co-authored-by: CommandCodeBot <noreply@commandcode.ai>"
          git push